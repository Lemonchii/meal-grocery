<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Grocery List</title>
<meta name="description" content="Pick meals, get one combined grocery list.">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Groceries">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f7d4f'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%232f7d4f'/%3E%3Ctext x='90' y='122' font-size='100' text-anchor='middle'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f2; --card:#fff; --ink:#1d2621; --muted:#6b756f; --line:#e4e7e1;
  --brand:#2f7d4f; --brand-2:#e8f3ec; --danger:#c0392b; --warn:#b7791f;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121614;--card:#1c221f;--ink:#e9eee9;--muted:#9aa59e;--line:#2b332e;--brand:#4fb87a;--brand-2:#1f3328;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{padding:12px 16px calc(150px + var(--safe-b));max-width:640px;margin:0 auto}
.view{display:none}.view.active{display:block}
.search{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.meal{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;transition:border-color .15s}
.meal.sel{border-color:var(--brand);background:linear-gradient(0deg,var(--brand-2),var(--brand-2)) padding-box}
.meal .emoji{font-size:30px;width:44px;text-align:center;flex:none}
.meal .info{flex:1;min-width:0;cursor:pointer}
.meal .name{font-weight:600}
.meal .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick{flex:none;min-width:64px;min-height:44px;border-radius:12px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font-weight:600;padding:0 12px}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:40px;height:44px;border-radius:12px;border:none;background:var(--brand);color:#fff;font-size:22px;font-weight:700;line-height:1}
.stepper .val{min-width:44px;text-align:center;font-size:13px;color:var(--muted)}
.stepper .val b{display:block;font-size:17px;color:var(--ink)}
.iconbtn{flex:none;width:44px;height:44px;border:none;background:transparent;border-radius:12px;color:var(--muted);font-size:20px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cta{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));padding:10px 16px;display:none;z-index:6}
.cta.show{display:block}
.cta .btn{width:100%;max-width:608px;margin:0 auto;display:block;box-shadow:0 6px 20px rgba(47,125,79,.35);min-height:54px;font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;min-height:64px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav button span.i{font-size:22px}
nav button.active{color:var(--brand)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--brand);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;min-width:18px}
.group{margin-bottom:14px;overflow:hidden}
.group h3{margin:0;padding:10px 14px;font-size:14px;background:var(--brand-2);color:var(--brand);display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;border-top:1px solid var(--line);min-height:56px}
.item:first-of-type{border-top:none}
.item label{flex:1;display:flex;align-items:center;gap:10px;padding:8px;min-height:48px;cursor:pointer;min-width:0}
.item input[type=checkbox]{width:26px;height:26px;accent-color:var(--brand);flex:none}
.item .t{min-width:0}
.item .q{font-weight:700;margin-right:4px}
.item .from{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .t{opacity:.45;text-decoration:line-through}
.have{flex:none;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:48px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar .btn{flex:1}
.extraform{display:flex;gap:8px;margin-bottom:12px}
.extraform input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 12px}
.progress div{height:100%;background:var(--brand);transition:width .2s}
.link{background:none;border:none;color:var(--brand);font-weight:600;min-height:44px;padding:0 6px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.sheet h2{margin:4px 0 12px;font-size:20px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px}
.ing{display:grid;grid-template-columns:1fr 64px 72px 44px;gap:6px;margin-bottom:6px;align-items:center}
.ing input,.ing select{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 8px;width:100%;min-width:0}
.ing select{grid-column:1 / 4}
.ingwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.importcard{padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.importcard .hint{font-size:13px;color:var(--muted);text-align:center}
.status{display:none;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--brand-2);color:var(--brand);font-weight:600;margin:10px 0;font-size:15px}
.status.show{display:flex}
.spin{width:20px;height:20px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{display:none;padding:12px;border-radius:12px;background:#fdecea;color:#8a1f15;margin:10px 0;font-size:15px}
@media (prefers-color-scheme:dark){.err{background:#3a1d1a;color:#ffb4a9}}
.err.show{display:block}
.note{padding:10px 12px;border-radius:12px;background:var(--brand-2);color:var(--ink);font-size:14px;margin-bottom:12px}
.note a{color:var(--brand);word-break:break-all}
details.paste{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.paste summary{min-height:52px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}
details.paste summary::-webkit-details-marker{display:none}
details.paste[open]{padding-bottom:12px}
textarea{width:100%;min-height:180px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;resize:vertical}
.caption{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px;max-height:110px;overflow:auto;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1 id="title">Pick your meals</h1>
  <p id="subtitle">Tap meals you want to make this week</p>
</header>

<main>
  <section id="view-meals" class="view active">
    <div class="card importcard">
      <button class="btn primary block" id="importBtn">🔗 Import recipe from a link</button>
      <div class="hint">Paste a link from a recipe site or a TikTok video</div>
    </div>
    <input id="search" class="search" type="search" placeholder="Search meals…" autocomplete="off">
    <div id="meals"></div>
    <button class="btn block" id="addMeal" style="margin-top:8px">＋ Add your own meal</button>
    <div style="text-align:center;margin-top:16px"><button class="link" id="restore">Restore built-in meals</button></div>
  </section>

  <section id="view-list" class="view">
    <div id="listChips" class="chips"></div>
    <div class="progress"><div id="prog" style="width:0"></div></div>
    <form id="extraForm" class="extraform" autocomplete="off">
      <input id="extraInput" placeholder="Add an extra item (e.g. paper towels)" enterkeyhint="done">
      <button class="btn primary" type="submit" aria-label="Add item">Add</button>
    </form>
    <div class="toolbar">
      <button class="btn" id="share">📤 Share</button>
      <button class="btn" id="clearChecked">Clear ✓</button>
      <button class="btn danger" id="newList">New list</button>
    </div>
    <div id="list"></div>
    <div id="hiddenWrap"></div>
  </section>
</main>

<div class="cta" id="cta"><button class="btn primary" id="goList">Make grocery list</button></div>

<nav>
  <button id="tab-meals" class="active" data-view="meals"><span class="i">🍽️</span>Meals<span class="badge" id="mealBadge" hidden></span></button>
  <button id="tab-list" data-view="list"><span class="i">🛒</span>Grocery list<span class="badge" id="listBadge" hidden></span></button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script id="core">
/* ===== Pure logic (unit-tested in node) ===== */
var CATEGORIES = ["Produce","Meat & Seafood","Dairy & Eggs","Bakery","Pantry","Spices","Frozen","Other"];

function normName(s){ return String(s||"").trim().replace(/\s+/g," ").toLowerCase(); }
function itemKey(name, unit){ return normName(name) + "|" + normName(unit); }

function round2(n){ return Math.round(n*100)/100; }

/* Scale a meal's ingredients: chosen servings / base servings */
function scaleIngredients(meal, servings){
  var base = meal.servings > 0 ? meal.servings : 1;
  var f = (servings > 0 ? servings : base) / base;
  return (meal.ingredients||[]).map(function(i){
    var q = (i.qty === "" || i.qty == null || isNaN(Number(i.qty))) ? null : round2(Number(i.qty) * f);
    return { name:i.name, qty:q, unit:i.unit||"", category:i.category||"Other" };
  });
}

/* selections: [{meal, servings}] ; extras: [{name, qty, unit, category}] */
function buildList(selections, extras){
  var map = {}, order = [];
  function add(ing, source){
    if(!ing || !normName(ing.name)) return;
    var k = itemKey(ing.name, ing.unit);
    var e = map[k];
    if(!e){
      e = map[k] = { key:k, name:String(ing.name).trim(), unit:(ing.unit||"").trim(), qty:null,
        category: CATEGORIES.indexOf(ing.category) >= 0 ? ing.category : "Other", sources:[], extra:false };
      order.push(k);
    }
    if(ing.qty != null && ing.qty !== "" && !isNaN(Number(ing.qty))) e.qty = round2((e.qty||0) + Number(ing.qty));
    if(source && e.sources.indexOf(source) < 0) e.sources.push(source);
    if(!source) e.extra = true;
  }
  (selections||[]).forEach(function(s){
    scaleIngredients(s.meal, s.servings).forEach(function(i){ add(i, s.meal.name); });
  });
  (extras||[]).forEach(function(x){ add(x, null); });
  var groups = CATEGORIES.map(function(c){
    return { category:c, items: order.map(function(k){return map[k];}).filter(function(e){return e.category===c;})
      .sort(function(a,b){ return a.name.localeCompare(b.name); }) };
  }).filter(function(g){ return g.items.length; });
  return groups;
}

var FRAC = [[0.125,"⅛"],[0.25,"¼"],[0.333,"⅓"],[0.5,"½"],[0.667,"⅔"],[0.75,"¾"]];
function fmtQty(q){
  if(q == null) return "";
  var whole = Math.floor(q), rem = q - whole;
  if(rem < 0.02) return String(whole);
  if(rem > 0.98) return String(whole+1);
  for(var i=0;i<FRAC.length;i++){
    if(Math.abs(rem - FRAC[i][0]) < 0.03) return (whole ? whole : "") + FRAC[i][1];
  }
  return String(round2(q));
}
/* Things bought whole (no unit, or package units) round UP to a buyable amount */
var WHOLE_UNITS = ["","head","heads","can","cans","jar","jars","bottle","bottles","packet","packets","bag","bags","box","boxes","loaf","loaves","bunch","bunches","pack","packs","stalks","cloves"];
function shopQty(e){
  if(e.qty == null) return null;
  return WHOLE_UNITS.indexOf(normName(e.unit)) >= 0 ? Math.ceil(e.qty - 0.01) : e.qty;
}
function fmtItem(e){
  var q = fmtQty(shopQty(e));
  return (q ? q + (e.unit ? " " + e.unit : "") + " " : (e.unit ? e.unit + " " : "")) + e.name;
}
function listToText(groups, isHidden, isChecked){
  var out = ["🛒 Grocery list",""];
  groups.forEach(function(g){
    var items = g.items.filter(function(e){ return !(isHidden && isHidden(e.key)); });
    if(!items.length) return;
    out.push(g.category.toUpperCase());
    items.forEach(function(e){ out.push((isChecked && isChecked(e.key) ? "✓ " : "• ") + fmtItem(e)); });
    out.push("");
  });
  return out.join("\n").trim();
}

/* Parse a free-text extra like "2 lb apples" or "milk" */
function parseExtra(text){
  var t = String(text||"").trim();
  var m = t.match(/^(\d+(?:\.\d+)?|\d+\/\d+)\s+(?:(lb|lbs|oz|g|kg|cup|cups|can|cans|pack|packs|bag|bags|bottle|bottles|box|boxes|dozen|bunch|jar|ct)\s+)?(.+)$/i);
  if(!m) return { name:t, qty:null, unit:"", category:"Other" };
  var q = m[1].indexOf("/")>0 ? (function(p){return Number(p[0])/Number(p[1]);})(m[1].split("/")) : Number(m[1]);
  return { name:m[3].trim(), qty:round2(q), unit:(m[2]||"").toLowerCase(), category:"Other" };
}


/* ===== Recipe import: ingredient parsing ===== */
var UNI_FRAC = {"½":"1/2","⅓":"1/3","⅔":"2/3","¼":"1/4","¾":"3/4","⅕":"1/5","⅖":"2/5","⅗":"3/5","⅘":"4/5","⅙":"1/6","⅚":"5/6","⅛":"1/8","⅜":"3/8","⅝":"5/8","⅞":"7/8"};
var WORD_NUM = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,half:0.5,dozen:12};
var UNIT_MAP = [
  [/^(tablespoons?|tbsps?|tbls?|tbs|tb)$/i,"tbsp"],[/^T$/,"tbsp"],
  [/^(teaspoons?|tsps?)$/i,"tsp"],[/^t$/,"tsp"],
  [/^(cups?|c)$/i,"cup"],
  [/^(fl\.? ?oz|fluid ounces?)$/i,"fl oz"],
  [/^(ounces?|oz)$/i,"oz"],[/^(pounds?|lbs?)$/i,"lb"],
  [/^(grams?|gr?|gms?)$/i,"g"],[/^(kilograms?|kgs?|kilos?)$/i,"kg"],
  [/^(millilit(er|re)s?|mls?)$/i,"ml"],[/^(lit(er|re)s?|l)$/i,"l"],
  [/^(quarts?|qts?)$/i,"qt"],[/^(pints?|pts?)$/i,"pint"],[/^(gallons?|gals?)$/i,"gallon"],
  [/^cloves?$/i,"cloves"],[/^(cans?|tins?)$/i,"can"],[/^jars?$/i,"jar"],[/^bottles?$/i,"bottle"],
  [/^(packages?|pkgs?|packets?|packs?|sachets?)$/i,"package"],[/^(boxe?s?)$/i,"box"],[/^bags?$/i,"bag"],
  [/^sticks?$/i,"stick"],[/^(slices?)$/i,"slices"],[/^pinch(es)?$/i,"pinch"],[/^dash(es)?$/i,"dash"],
  [/^(bunch(es)?)$/i,"bunch"],[/^heads?$/i,"head"],[/^sprigs?$/i,"sprigs"],[/^stalks?$/i,"stalks"],
  [/^(ribs?)$/i,"stalks"],[/^handfuls?$/i,"handful"],[/^(pieces?|pcs?)$/i,"pieces"],[/^fillets?$/i,"fillets"],
  [/^loa(f|ves)$/i,"loaf"],[/^(inch|inches|in)$/i,"inch"],[/^(cm)$/i,"cm"],[/^leaves$/i,"leaves"],[/^(sheets?)$/i,"sheets"],[/^(drops?)$/i,"drops"],[/^(scoops?)$/i,"scoop"],[/^(envelopes?)$/i,"package"],[/^(containers?|tubs?)$/i,"container"]
];
function normUnit(w){
  if(!w) return null;
  var c = w.replace(/\.$/,"");
  for(var i=0;i<UNIT_MAP.length;i++) if(UNIT_MAP[i][0].test(c)) return UNIT_MAP[i][1];
  return null;
}
var SIZE_WORDS = /^(extra[- ]large|x-large|large|medium|small|big|jumbo|heaping|heaped|level|scant|generous|good)\s+/i;
var PREP_WORDS = /\b(finely|roughly|coarsely|thinly|thickly|freshly|lightly|very|well|chopped|minced|diced|sliced|peeled|deveined|seeded|deseeded|cubed|trimmed|softened|melted|beaten|whisked|rinsed|drained|halved|quartered|julienned|cored|pitted|stemmed|torn|crumbled|sifted|packed|divided|separated|zested|juiced|cooked|uncooked|optional|to taste|as needed|for garnish|for serving|for frying|at room temperature|room temperature|cold|warm|hot|cut into [^,]*|plus more[^,]*|or more|or to taste)\b/gi;

function decodeEntities(s){
  return String(s==null?"":s).replace(/&(#x[0-9a-f]+|#\d+|[a-z]+\d*);/gi, function(m, e){
    if(e[0]==="#") { var n = e[1].toLowerCase()==="x" ? parseInt(e.slice(2),16) : parseInt(e.slice(1),10); return isNaN(n)?m:String.fromCodePoint(n); }
    var map={amp:"&",lt:"<",gt:">",quot:'"',apos:"'",nbsp:" ",frac12:"½",frac14:"¼",frac34:"¾",frac13:"⅓",frac23:"⅔",frac18:"⅛",deg:"°",ndash:"–",mdash:"—",rsquo:"’",lsquo:"‘",rdquo:"”",ldquo:"“",hellip:"…",eacute:"é",egrave:"è",ntilde:"ñ",reg:"®",trade:"™",times:"×"};
    return map[e.toLowerCase()] != null ? map[e.toLowerCase()] : m;
  }).replace(/<[^>]+>/g,"");
}

/* Parse a number token: "1", "1.5", "1/2", "1 1/2" */
function numVal(tok){
  tok = tok.trim();
  var m;
  if((m = tok.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return Number(m[1]) + Number(m[2])/Number(m[3]);
  if((m = tok.match(/^(\d+)\/(\d+)$/))) return Number(m[2]) ? Number(m[1])/Number(m[2]) : null;
  if(/^\d*[.,]?\d+$/.test(tok)) return Number(tok.replace(",","."));
  return null;
}
/* Parse a qty string as typed in the editor or found in text (supports ranges -> upper bound) */
function parseQty(s){
  if(s == null) return null;
  s = String(s).trim().replace(/[½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞]/g, function(f){ return " " + UNI_FRAC[f]; }).replace(/\u2044/g,"/").trim().replace(/\s+/g," ");
  var r = s.split(/\s*(?:-|–|—|to|or)\s*/i);
  var v = numVal(r[r.length-1]);
  return v == null ? null : round2(v);
}

<script>
(function(){
var LS = "mealGrocery.v1";
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

var state;
function defaults(){ return { meals: clone(BUILTIN_MEALS), sel:{}, checked:{}, have:{}, extras:[], view:"meals" }; }
function load(){
  try { var s = JSON.parse(localStorage.getItem(LS)); if(s && Array.isArray(s.meals)){ var d = defaults(); for(var k in d) if(!(k in s)) s[k]=d[k]; return s; } } catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
state = load();

var toastT;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},1800); }

function mealById(id){ for(var i=0;i<state.meals.length;i++) if(state.meals[i].id===id) return state.meals[i]; return null; }
function selections(){
  var out=[]; for(var id in state.sel){ var m=mealById(id); if(m) out.push({meal:m, servings:state.sel[id]}); else delete state.sel[id]; }
  return out;
}
function currentGroups(){ return buildList(selections(), state.extras); }

/* ---------- Meals view ---------- */
function renderMeals(){
  var q = normName($("#search").value);
  var html = "";
  var meals = state.meals.filter(function(m){
    return !q || normName(m.name).indexOf(q)>=0 || m.ingredients.some(function(i){return normName(i.name).indexOf(q)>=0;});
  });
  var selected = meals.filter(function(m){return state.sel[m.id];});
  var others = meals.filter(function(m){return !state.sel[m.id];});
  function card(m){
    var s = state.sel[m.id];
    var sub = s ? (m.ingredients.length + " ingredients") : (m.ingredients.slice(0,4).map(function(i){return i.name;}).join(", ") + (m.ingredients.length>4?"…":""));
    var right = s
      ? '<div class="stepper"><button data-act="dec" data-id="'+m.id+'" aria-label="Fewer servings">−</button><div class="val"><b>'+s+'</b>servings</div><button data-act="inc" data-id="'+m.id+'" aria-label="More servings">+</button></div>'
      : '<button class="pick" data-act="pick" data-id="'+m.id+'">Add</button>';
    return '<div class="card meal'+(s?' sel':'')+'"><div class="emoji">'+esc(m.emoji||"🍽️")+'</div>'+
      '<div class="info" data-act="edit" data-id="'+m.id+'"><div class="name">'+esc(m.name)+'</div><div class="sub">'+esc(sub)+'</div></div>'+right+'</div>';
  }
  if(selected.length){
    html += '<div class="sectiontitle"><span>Selected ('+selected.length+')</span><button class="link" data-act="clearsel">Clear</button></div>';
    html += selected.map(card).join("");
    html += '<div class="sectiontitle"><span>More meals</span></div>';
  }
  html += others.map(card).join("");
  if(!meals.length) html = '<div class="empty"><div class="big">🔍</div>No meals match “'+esc($("#search").value)+'”.</div>';
  $("#meals").innerHTML = html;
}

/* ---------- List view ---------- */
function renderList(){
  var groups = currentGroups();
  var total=0, done=0, hidden=[];
  var html = groups.map(function(g){
    var vis = g.items.filter(function(e){ if(state.have[e.key]){ hidden.push(e); return false;} return true; });
    if(!vis.length) return "";
    var rows = vis.map(function(e){
      total++; var c = !!state.checked[e.key]; if(c) done++;
      var q = fmtQty(shopQty(e));
      var from = e.sources.length ? e.sources.join(", ") : "Extra item";
      return '<div class="item'+(c?' done':'')+'"><label><input type="checkbox" data-key="'+esc(e.key)+'"'+(c?' checked':'')+'>'+
        '<span class="t">'+(q||e.unit?'<span class="q">'+esc(q+(e.unit?(q?" ":"")+e.unit:""))+'</span> ':'')+esc(e.name)+'<span class="from">'+esc(from)+'</span></span></label>'+
        (e.extra && !e.sources.length ? '<button class="have" data-act="delextra" data-key="'+esc(e.key)+'" aria-label="Remove">✕</button>'
          : '<button class="have" data-act="have" data-key="'+esc(e.key)+'">Have it</button>')+'</div>';
    }).join("");
    return '<div class="card group"><h3><span>'+esc(g.category)+'</span><span>'+vis.length+'</span></h3>'+rows+'</div>';
  }).join("");
  if(!groups.length){
    html = '<div class="empty"><div class="big">🧺</div>Your list is empty.<br>Pick some meals first, or add extra items above.<br><br><button class="btn primary" data-act="tomeals">Choose meals</button></div>';
  }
  $("#list").innerHTML = html;
  var hw = "";
  if(hidden.length){
    hw = '<div class="sectiontitle"><span>Already have ('+hidden.length+')</span></div><div class="card group">'+
      hidden.map(function(e){ return '<div class="item"><label><span class="t" style="opacity:.6">'+esc(fmtItem(e))+'</span></label><button class="have" data-act="unhave" data-key="'+esc(e.key)+'">Need it</button></div>'; }).join("")+'</div>';
  }
  $("#hiddenWrap").innerHTML = hw;
  var sels = selections();
  $("#listChips").innerHTML = sels.map(function(s){ return '<span class="chip">'+esc((s.meal.emoji||"")+" "+s.meal.name)+' · '+s.servings+'</span>'; }).join("");
  $("#prog").style.width = total ? (100*done/total)+"%" : "0";
  return {total:total, done:done};
}

function render(){
  var v = state.view;
  document.querySelectorAll(".view").forEach(function(el){ el.classList.toggle("active", el.id==="view-"+v); });
  document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("active", b.dataset.view===v); });
  var nSel = Object.keys(state.sel).length;
  renderMeals();
  var st = renderList();
  var left = st.total - st.done;
  $("#mealBadge").hidden = !nSel; $("#mealBadge").textContent = nSel;
  $("#listBadge").hidden = !left; $("#listBadge").textContent = left;
  $("#cta").classList.toggle("show", v==="meals" && nSel>0);
  $("#goList").textContent = "Make grocery list (" + nSel + " meal" + (nSel===1?"":"s") + ")";
  if(v==="meals"){ $("#title").textContent="Pick your meals"; $("#subtitle").textContent= nSel ? nSel+" selected · tap a meal to view or edit" : "Tap Add on meals you want to make"; }
  else { $("#title").textContent="Grocery list"; $("#subtitle").textContent= st.total ? (st.done+" of "+st.total+" in the cart") : "Nothing to buy yet"; }
  save();
}
function setView(v){ state.view=v; render(); window.scrollTo(0,0); }

/* ---------- Events ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act],[data-view]"); if(!t) return;
  if(t.dataset.view && !t.dataset.act){ setView(t.dataset.view); return; }
  var id=t.dataset.id, key=t.dataset.key, m=id&&mealById(id);
  switch(t.dataset.act){
    case "pick": state.sel[id] = m.servings||4; break;
    case "inc": state.sel[id] = Math.min(99,(state.sel[id]||1)+1); break;
    case "dec": if(state.sel[id]<=1) delete state.sel[id]; else state.sel[id]--; break;
    case "clearsel": state.sel={}; break;
    case "edit": openEditor(m); return;
    case "have": state.have[key]=true; delete state.checked[key]; toast("Hidden — you already have it"); break;
    case "unhave": delete state.have[key]; break;
    case "delextra": state.extras = state.extras.filter(function(x){ return itemKey(x.name,x.unit)!==key; }); delete state.checked[key]; break;
    case "tomeals": setView("meals"); return;
    default: return;
  }
  render();
});
document.addEventListener("change", function(ev){
  var k = ev.target.dataset && ev.target.dataset.key;
  if(ev.target.type==="checkbox" && k){ if(ev.target.checked) state.checked[k]=true; else delete state.checked[k]; render(); }
});
$("#search").addEventListener("input", renderMeals);
$("#goList").addEventListener("click", function(){ setView("list"); });
$("#addMeal").addEventListener("click", function(){ openEditor(null); });
$("#restore").addEventListener("click", function(){
  var have = {}; state.meals.forEach(function(m){ have[m.id]=1; });
  var added = 0;
  BUILTIN_MEALS.forEach(function(b){ if(!have[b.id]){ state.meals.push(clone(b)); added++; } });
  if(!added && !confirm("Reset built-in meals to their original recipes? Your own meals are kept.")) return;
  if(!added){ state.meals = state.meals.map(function(m){ var b=BUILTIN_MEALS.filter(function(x){return x.id===m.id;})[0]; return b?clone(b):m; }); }
  toast(added ? "Restored "+added+" meal"+(added>1?"s":"") : "Built-in meals reset"); render();
});
$("#extraForm").addEventListener("submit", function(ev){
  ev.preventDefault(); var v=$("#extraInput").value.trim(); if(!v) return;
  var x = parseExtra(v); state.extras.push(x); delete state.have[itemKey(x.name,x.unit)];
  $("#extraInput").value=""; render();
});
$("#clearChecked").addEventListener("click", function(){
  var n=Object.keys(state.checked).length; if(!n){ toast("Nothing checked yet"); return; }
  // checked extras are removed; checked meal items are unchecked
  state.extras = state.extras.filter(function(x){ return !state.checked[itemKey(x.name,x.unit)]; });
  state.checked={}; toast("Cleared checked items"); render();
});
$("#newList").addEventListener("click", function(){
  if(!confirm("Start a new list? This clears selected meals, extras, and checkmarks.")) return;
  state.sel={}; state.checked={}; state.have={}; state.extras=[]; setView("meals");
});
$("#share").addEventListener("click", function(){
  var text = listToText(currentGroups(), function(k){return state.have[k];}, function(k){return state.checked[k];});
  if(text.split("\n").length<=1){ toast("List is empty"); return; }
  if(navigator.share){ navigator.share({title:"Grocery list", text:text}).catch(function(e){ if(e && e.name!=="AbortError") copy(text); }); }
  else copy(text);
});
function copy(text){
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok=false; try{ ok=document.execCommand("copy"); }catch(e){} document.body.removeChild(ta);
    toast(ok ? "List copied to clipboard" : "Couldn't copy — try again");
  }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(function(){ toast("List copied to clipboard"); }, fallback); }
  else fallback();
}

/* ---------- Meal editor ---------- */
var modal=$("#modal"), sheet=$("#sheet");
function closeModal(){ modal.classList.remove("show"); document.body.style.overflow=""; }
modal.addEventListener("click", function(e){ if(e.target===modal) closeModal(); });
function catOptions(sel){ return CATEGORIES.map(function(c){ return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'; }).join(""); }
function ingRow(i){
  i = i || {name:"",qty:"",unit:"",category:"Produce"};
  return '<div class="ingwrap"><div class="ing"><input class="in-name" placeholder="Ingredient" value="'+esc(i.name)+'">'+
    '<input class="in-qty" inputmode="decimal" placeholder="Qty" value="'+esc(qtyToInput(i.qty))+'">'+
    '<input class="in-unit" placeholder="Unit" value="'+esc(i.unit)+'">'+
    '<button type="button" class="iconbtn rm" aria-label="Remove ingredient">🗑️</button>'+
    '<select class="in-cat">'+catOptions(i.category)+'</select></div></div>';
}
function openEditor(m, opts){
  opts = opts || {};
  var isNew = !m || !m.id; m = m ? clone(m) : {id:null, name:"", emoji:"🍽️", servings:4, ingredients:[{name:"",qty:"",unit:"",category:"Produce"}]};
  if(!m.ingredients || !m.ingredients.length) m.ingredients=[{name:"",qty:"",unit:"",category:"Produce"}];
  sheet.innerHTML = '<h2>'+(opts.title || (isNew?"New meal":"Edit meal"))+'</h2>'+
    (opts.note ? '<div class="note">'+opts.note+'</div>' : (m.source ? '<div class="note">Imported from <a href="'+esc(m.source)+'" target="_blank" rel="noopener">'+esc(m.source.replace(/^https?:\/\/(www\.)?/,"").slice(0,50))+'</a></div>' : ''))+
    '<div class="row"><label class="field" style="width:76px"><span>Icon</span><input id="ed-emoji" maxlength="4" value="'+esc(m.emoji)+'" style="text-align:center;font-size:22px"></label>'+
    '<label class="field" style="flex:1"><span>Meal name</span><input id="ed-name" placeholder="e.g. Grandma\'s meatloaf" value="'+esc(m.name)+'"></label></div>'+
    '<label class="field"><span>Recipe makes (servings)</span><input id="ed-serv" type="number" min="1" max="99" inputmode="numeric" value="'+esc(m.servings)+'"></label>'+
    '<div class="sectiontitle" style="margin-top:4px"><span>Ingredients</span></div><div id="ed-ings">'+m.ingredients.map(ingRow).join("")+'</div>'+
    '<button class="btn block" id="ed-add" type="button">＋ Add ingredient</button>'+
    '<div class="row" style="margin-top:16px"><button class="btn" id="ed-cancel" style="flex:1">Cancel</button><button class="btn primary" id="ed-save" style="flex:2">Save meal</button></div>'+
    (isNew?'':'<button class="btn block danger" id="ed-del" style="margin-top:10px">Delete meal</button>');
  modal.classList.add("show"); document.body.style.overflow="hidden";
  $("#ed-add").onclick=function(){ $("#ed-ings").insertAdjacentHTML("beforeend", ingRow()); var ins=$("#ed-ings").querySelectorAll(".in-name"); ins[ins.length-1].focus(); };
  $("#ed-ings").onclick=function(e){ var b=e.target.closest(".rm"); if(b) b.closest(".ingwrap").remove(); };
  $("#ed-cancel").onclick=closeModal;
  if(!isNew) $("#ed-del").onclick=function(){ if(!confirm('Delete "'+m.name+'"?')) return; state.meals=state.meals.filter(function(x){return x.id!==m.id;}); delete state.sel[m.id]; closeModal(); render(); toast("Meal deleted"); };
  $("#ed-save").onclick=function(){
    var name=$("#ed-name").value.trim(); if(!name){ $("#ed-name").focus(); toast("Give your meal a name"); return; }
    var ings=[]; $("#ed-ings").querySelectorAll(".ingwrap").forEach(function(w){
      var n=w.querySelector(".in-name").value.trim(); if(!n) return;
      var qs=w.querySelector(".in-qty").value.trim(), q=null;
      if(qs){ q = parseQty(qs); }
      ings.push({name:n, qty:q, unit:w.querySelector(".in-unit").value.trim(), category:w.querySelector(".in-cat").value});
    });
    if(!ings.length){ toast("Add at least one ingredient"); return; }
    var meal={id:m.id||uid(), source:m.source||undefined, name:name, emoji:$("#ed-emoji").value.trim()||"🍽️", servings:Math.max(1,parseInt($("#ed-serv").value,10)||4), ingredients:ings};
    if(isNew) state.meals.unshift(meal); else state.meals=state.meals.map(function(x){return x.id===meal.id?meal:x;});
    closeModal(); render(); toast(isNew?"Meal added":"Meal saved");
  };
  if(isNew && !opts.title) setTimeout(function(){ $("#ed-name").focus(); },50);
  sheet.scrollTop = 0;
}

/* ---------- Import from link ---------- */
var PROXIES = [
  { name:"direct", url:function(u){ return u; }, timeout:6000 },
  { name:"r.jina.ai", url:function(u){ return "https://r.jina.ai/" + u; }, headers:{"X-Return-Format":"html"}, timeout:25000 },
  { name:"allorigins", url:function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }, timeout:10000 },
  { name:"codetabs", url:function(u){ return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u); }, timeout:10000 },
  { name:"cors.lol", url:function(u){ return "https://api.cors.lol/?url=" + encodeURIComponent(u); }, timeout:10000 }
];
var BLOCKING_SITES = /(allrecipes|seriouseats|simplyrecipes|eatingwell|foodandwine|marthastewart|bhg|southernliving|myrecipes|realsimple|thespruceeats|delish|tasteofhome)\./i;

function fetchWithTimeout(url, ms, headers, signal){
  var ctl = new AbortController(), timer = setTimeout(function(){ ctl.abort(); }, ms);
  if(signal) signal.addEventListener("abort", function(){ ctl.abort(); });
  return fetch(url, { signal:ctl.signal, headers:headers||{}, credentials:"omit", redirect:"follow" })
    .finally(function(){ clearTimeout(timer); });
}
/* Try each proxy until accept(html) returns something truthy. */
async function fetchViaProxies(url, accept, progress, signal){
  var log = [], lastHtml = null, blocked = false;
  for(var i=0;i<PROXIES.length;i++){
    if(signal && signal.aborted) throw new Error("cancelled");
    var p = PROXIES[i];
    progress && progress(i===0 ? "Opening the page…" : "Trying another way in (" + (i+1) + " of " + PROXIES.length + ")…");
    try{
      var res = await fetchWithTimeout(p.url(url), p.timeout, p.headers, signal);
      var text = await res.text();
      if(res.status === 451 || /excluded from Jina Reader/i.test(text.slice(0,400))) blocked = true;
      if(!res.ok){ log.push(p.name + ": HTTP " + res.status); continue; }
      if(text.length < 200){ log.push(p.name + ": empty"); continue; }
      lastHtml = text;
      var got = accept(text);
      if(got){ got.proxy = p.name; return got; }
      log.push(p.name + ": no recipe in page");
    }catch(e){ log.push(p.name + ": " + (e.name==="AbortError" ? "timed out" : (e.message||"failed"))); }
  }
  if(signal && signal.aborted) throw new Error("cancelled");
  var err = new Error("all proxies failed"); err.log = log; err.lastHtml = lastHtml; err.blocked = blocked; throw err;
}
/* DOM-based fallback for pages without JSON-LD (microdata, popular recipe plugins) */
function domExtract(html){
  try{
    var safe = html.replace(/<(script|style|iframe|noscript|svg)\b[\s\S]*?<\/\1>/gi," ").replace(/<(link|img|source|video|audio|meta)\b[^>]*>/gi," ");
    var doc = new DOMParser().parseFromString(safe, "text/html");
    var sels = ['[itemprop="recipeIngredient"]','[itemprop="ingredients"]','.wprm-recipe-ingredient','.tasty-recipes-ingredients li','.mv-create-ingredients li','.ingredients-item','[class*="ingredient-list"] li','[class*="ingredients"] li'];
    for(var i=0;i<sels.length;i++){
      var els = Array.prototype.slice.call(doc.querySelectorAll(sels[i]));
      var lines = els.map(function(e){ return e.textContent.replace(/\s+/g," ").trim(); }).filter(function(t){ return t && t.length < 160; });
      if(lines.length >= 2){
        var h = doc.querySelector('[itemtype*="Recipe"] [itemprop="name"]') || doc.querySelector("h1");
        var y = doc.querySelector('[itemprop="recipeYield"]');
        return { name: h ? h.textContent.trim() : pageTitle(html), servings: y ? parseYield(y.getAttribute("content") || y.textContent) : null, lines: lines, via:"page" };
      }
    }
  }catch(e){}
  return null;
}
function recipeFromHtml(html){
  var r = extractRecipeFromHtml(html) || domExtract(html);
  if(r && !r.name) r.name = pageTitle(html);
  return r;
}
function guessEmoji(name){
  var n = normName(name), map = [[/pasta|spaghetti|penne|rigatoni|fettuc|linguine|alfredo|noodle|mac/, "🍝"],[/taco|burrito|quesadilla|enchilada|fajita/,"🌮"],[/pizza/,"🍕"],[/burger/,"🍔"],[/salad/,"🥗"],[/soup|stew|chili|chowder/,"🍲"],[/curry/,"🍛"],[/salmon|fish|cod|tuna/,"🐟"],[/shrimp|prawn/,"🍤"],[/steak|beef/,"🥩"],[/chicken|wings/,"🍗"],[/pancake|waffle/,"🥞"],[/cookie/,"🍪"],[/cake|cupcake/,"🍰"],[/pie/,"🥧"],[/bread|loaf|focaccia/,"🍞"],[/egg|omelet|frittata/,"🍳"],[/rice|risotto/,"🍚"],[/sandwich|sub|wrap/,"🥪"],[/smoothie|shake/,"🥤"],[/sushi/,"🍣"],[/dumpling|gyoza/,"🥟"]];
  for(var i=0;i<map.length;i++) if(map[i][0].test(n)) return map[i][1];
  return "🍽️";
}
function toMeal(r, source){
  var ings = (r.ingredients || r.lines.map(parseIngredientLine)).filter(function(i){ return i && i.name; });
  var name = (r.name || "Imported recipe").replace(/\s+/g," ").trim().slice(0,80);
  return { id:null, source:source||undefined, name:name, emoji:guessEmoji(name), servings:r.servings||4, ingredients:ings };
}

/* TikTok: caption via oEmbed (CORS-enabled), falling back to the page's embedded JSON through proxies */
function captionFromTikTokHtml(html){
  var m = html.match(/<script[^>]+id="__UNIVERSAL_DATA_FOR_REHYDRATION__"[^>]*>([\s\S]*?)<\/script>/);
  if(m){ try{ var d = JSON.parse(m[1]); var it = d.__DEFAULT_SCOPE__["webapp.video-detail"].itemInfo.itemStruct; return { caption: it.desc, author: it.author && (it.author.nickname || it.author.uniqueId), id: it.id }; }catch(e){} }
  m = html.match(/<script[^>]+id="SIGI_STATE"[^>]*>([\s\S]*?)<\/script>/);
  if(m){ try{ var s2 = JSON.parse(m[1]); var k = Object.keys(s2.ItemModule||{})[0]; if(k) return { caption: s2.ItemModule[k].desc, author: s2.ItemModule[k].author, id:k }; }catch(e){} }
  var c = html.match(/<link[^>]+rel="canonical"[^>]+href="([^"]+)"/i) || html.match(/property="og:url"[^>]+content="([^"]+)"/i);
  var id = c && tiktokVideoId(c[1]);
  var dm = html.match(/"desc":"((?:[^"\\]|\\.)*)"/);
  var cap = null; if(dm){ try{ cap = JSON.parse('"' + dm[1] + '"'); }catch(e){} }
  if(id || cap) return { caption: cap, author:null, id:id };
  return null;
}
async function oembed(videoUrl, signal){
  var res = await fetchWithTimeout("https://www.tiktok.com/oembed?url=" + encodeURIComponent(videoUrl), 10000, null, signal);
  if(!res.ok) throw new Error("oEmbed HTTP " + res.status);
  var j = await res.json(); if(!j || typeof j.title !== "string") throw new Error("oEmbed: no caption");
  return { caption: j.title, author: j.author_name };
}
async function importTikTok(url, progress, signal){
  var id = tiktokVideoId(url), info = null, via = "";
  progress("Reading the TikTok caption…");
  try{ info = await oembed(id ? "https://www.tiktok.com/@_/video/" + id : url, signal); via = "TikTok oEmbed"; }catch(e){}
  if(!info){
    // short link or oEmbed failure: load the page through proxies to resolve the video & caption
    progress("Opening the TikTok page…");
    var page = await fetchViaProxies(url, function(html){ return captionFromTikTokHtml(html); }, progress, signal);
    if(page.id && !page.caption){ try{ info = await oembed("https://www.tiktok.com/@_/video/" + page.id, signal); }catch(e){} }
    if(!info && page.caption) info = { caption: page.caption, author: page.author };
    via = "TikTok page via " + page.proxy;
    if(!info) throw Object.assign(new Error("no caption"), { tiktokNoCaption:true });
  }
  var r = extractFromCaption(info.caption || "");
  r.caption = info.caption; r.author = info.author; r.via = via;
  if(!r.name) r.name = info.author ? "TikTok recipe from " + info.author : "TikTok recipe";
  return r;
}

var importCtl = null;
function openImport(prefill){
  sheet.innerHTML = '<h2>Import a recipe</h2>'+
    '<p style="margin:-4px 0 12px;color:var(--muted);font-size:14px">Paste a link to a recipe page (most food blogs and recipe sites) or a TikTok video whose caption lists the ingredients.</p>'+
    '<form id="im-form" autocomplete="off" novalidate><label class="field"><span>Recipe link</span><input id="im-url" type="url" inputmode="url" placeholder="https://…" value="'+esc(prefill||"")+'" enterkeyhint="go"></label>'+
    '<div class="row"><button type="button" class="btn" id="im-pastebtn" style="flex:1">📋 Paste</button><button type="submit" class="btn primary" id="im-go" style="flex:2">Import</button></div></form>'+
    '<div class="status" id="im-status"><div class="spin"></div><span id="im-status-t">Working…</span></div>'+
    '<div class="err" id="im-err"></div>'+
    '<details class="paste" id="im-paste"><summary>✍️ Or paste the ingredient list as text</summary>'+
      '<label class="field"><span>Meal name</span><input id="im-name" placeholder="e.g. Creamy tomato pasta"></label>'+
      '<label class="field"><span>Ingredients (one per line works best)</span><textarea id="im-text" placeholder="2 cups flour&#10;1 1/2 tsp salt&#10;3 cloves garlic, minced&#10;1 (14 oz) can diced tomatoes"></textarea></label>'+
      '<button type="button" class="btn primary block" id="im-usetext">Use this list</button></details>'+
    '<button type="button" class="btn block" id="im-cancel" style="margin-top:12px">Cancel</button>';
  modal.classList.add("show"); document.body.style.overflow="hidden";
  var urlIn = $("#im-url");
  if(!prefill) setTimeout(function(){ urlIn.focus(); }, 50);
  $("#im-cancel").onclick = function(){ if(importCtl) importCtl.abort(); closeModal(); };
  var pb = $("#im-pastebtn");
  if(!(navigator.clipboard && navigator.clipboard.readText)) pb.style.display="none";
  pb.onclick = function(){ navigator.clipboard.readText().then(function(t){ var m = String(t).match(/https?:\/\/\S+/); urlIn.value = m ? m[0] : t.trim(); }, function(){ toast("Long-press the box to paste"); urlIn.focus(); }); };
  $("#im-usetext").onclick = function(){
    var txt = $("#im-text").value; var r = parseIngredientText(txt);
    if(!r.ingredients.length){ showErr("I couldn't find any ingredients in that text. Put one ingredient per line, like “2 cups flour”."); return; }
    if($("#im-name").value.trim()) r.name = $("#im-name").value.trim();
    var meal = toMeal(r, urlIn.value.trim() && /^https?:/i.test(urlIn.value.trim()) ? urlIn.value.trim() : null);
    if(!r.name) meal.name = "";
    openEditor(meal, { title:"Review imported meal", note:"Found <b>"+meal.ingredients.length+" ingredients</b>. Check the amounts and categories, then tap <b>Save meal</b>." });
  };
  $("#im-form").onsubmit = function(ev){ ev.preventDefault(); runImport(urlIn.value); };
  if(prefill) runImport(prefill);
}
function showStatus(t){ var s=$("#im-status"); if(!s) return; if(t){ $("#im-status-t").textContent=t; s.classList.add("show"); } else s.classList.remove("show"); }
function showErr(html, openPaste){
  var e=$("#im-err"); if(!e) return; if(!html){ e.classList.remove("show"); return; }
  e.innerHTML = html; e.classList.add("show");
  if(openPaste){ var d=$("#im-paste"); d.open = true; }
}
async function runImport(raw){
  var url = String(raw||"").trim(); var m = url.match(/https?:\/\/\S+/); if(m) url = m[0];
  else if(/^[\w-]+(\.[\w-]+)+\//.test(url)) url = "https://" + url;
  showErr(null);
  if(!/^https?:\/\/[^\s/]+\.[^\s/]+/i.test(url)){ showErr("That doesn't look like a web link. Copy it from the share button (it should start with <b>https://</b>)."); return; }
  if(importCtl) importCtl.abort();
  var ctl = importCtl = new AbortController();
  var go = $("#im-go"); go.disabled = true; go.textContent = "Importing…";
  try{
    var r, isTT = isTikTokUrl(url);
    if(isTT){
      r = await importTikTok(url, showStatus, ctl.signal);
      if(!r.lines.length){
        if($("#im-name")) $("#im-name").value = r.name || "";
        showErr("<b>This TikTok's caption doesn't list the ingredients.</b> Lots of creators only say them in the video (or put them behind a link in their bio). Watch it and type the list below. One per line is perfect." +
          (r.caption ? '<div class="caption">'+esc(r.caption.slice(0,500))+'</div>' : ""), true);
        return;
      }
    } else {
      r = await fetchViaProxies(url, recipeFromHtml, showStatus, ctl.signal);
    }
    if(ctl.signal.aborted) return;
    var meal = toMeal(r, url);
    if(!meal.ingredients.length) throw new Error("no ingredients");
    var src = esc(new URL(url).hostname.replace(/^www\./,""));
    openEditor(meal, { title:"Review imported meal", note:"Imported <b>"+meal.ingredients.length+" ingredients</b> from "+(isTT?"the TikTok caption":src)+". Give the amounts and categories a quick check, then tap <b>Save meal</b>." });
  }catch(e){
    if(ctl.signal.aborted || e.message==="cancelled") return;
    var host = ""; try{ host = new URL(url).hostname.replace(/^www\./,""); }catch(_){}
    var msg;
    if(e.tiktokNoCaption) msg = "I couldn't read that TikTok. It may be private, deleted, or a short link that didn't open. Try the full link (open the video in your browser and copy it), or paste the ingredients below.";
    else if(e.lastHtml) msg = "I opened the page but couldn't find a recipe card on it. If it's a recipe, copy the ingredient list and paste it below.";
    else if(e.blocked || BLOCKING_SITES.test(host)) msg = "<b>" + esc(host) + "</b> blocks apps from reading its recipes. Open the recipe, copy the ingredient list, and paste it below.";
    else msg = "I couldn't reach that page right now. The site may be blocking outside readers, or the free reader services are busy. Try again in a minute, or paste the ingredient list below.";
    showErr(msg, true);
    if(window.console) console.warn("import failed", e.log || e);
  }finally{
    if(importCtl === ctl) importCtl = null;
    showStatus(null); var g=$("#im-go"); if(g){ g.disabled=false; g.textContent="Import"; }
  }
}
$("#importBtn").addEventListener("click", function(){ openImport(""); });
// allow ?import=<url> deep link (handy for sharing a link straight into the app)
try{ var qp = new URLSearchParams(location.search).get("import") || new URLSearchParams(location.search).get("text") || new URLSearchParams(location.search).get("url"); if(qp){ history.replaceState(null,"",location.pathname); setTimeout(function(){ openImport((qp.match(/https?:\/\/\S+/)||[qp])[0]); },0); } }catch(e){}

render();
})();
