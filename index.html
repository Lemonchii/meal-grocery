<style>
:root{
  --bg:#f5f6f2; --card:#fff; --ink:#1d2621; --muted:#6b756f; --line:#e4e7e1;
  --brand:#2f7d4f; --brand-2:#e8f3ec; --danger:#c0392b; --warn:#b7791f;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121614;--card:#1c221f;--ink:#e9eee9;--muted:#9aa59e;--line:#2b332e;--brand:#4fb87a;--brand-2:#1f3328;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{padding:12px 16px calc(150px + var(--safe-b));max-width:640px;margin:0 auto}
.view{display:none}.view.active{display:block}
.search{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.meal{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;transition:border-color .15s}
.meal.sel{border-color:var(--brand);background:linear-gradient(0deg,var(--brand-2),var(--brand-2)) padding-box}
.meal .emoji{font-size:30px;width:44px;text-align:center;flex:none}
.meal .info{flex:1;min-width:0;cursor:pointer}
.meal .name{font-weight:600}
.meal .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick{flex:none;min-width:64px;min-height:44px;border-radius:12px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font-weight:600;padding:0 12px}
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.stepper button{width:40px;height:44px;border-radius:12px;border:none;background:var(--brand);color:#fff;font-size:22px;font-weight:700;line-height:1}
.stepper .val{min-width:44px;text-align:center;font-size:13px;color:var(--muted)}
.stepper .val b{display:block;font-size:17px;color:var(--ink)}
.iconbtn{flex:none;width:44px;height:44px;border:none;background:transparent;border-radius:12px;color:var(--muted);font-size:20px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cta{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));padding:10px 16px;display:none;z-index:6}
.cta.show{display:block}
.cta .btn{width:100%;max-width:608px;margin:0 auto;display:block;box-shadow:0 6px 20px rgba(47,125,79,.35);min-height:54px;font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;min-height:64px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav button span.i{font-size:22px}
nav button.active{color:var(--brand)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--brand);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;min-width:18px}
.group{margin-bottom:14px;overflow:hidden}
.group h3{margin:0;padding:10px 14px;font-size:14px;background:var(--brand-2);color:var(--brand);display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;border-top:1px solid var(--line);min-height:56px}
.item:first-of-type{border-top:none}
.item label{flex:1;display:flex;align-items:center;gap:10px;padding:8px;min-height:48px;cursor:pointer;min-width:0}
.item input[type=checkbox]{width:26px;height:26px;accent-color:var(--brand);flex:none}
.item .t{min-width:0}
.item .q{font-weight:700;margin-right:4px}
.item .from{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .t{opacity:.45;text-decoration:line-through}
.have{flex:none;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:48px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar .btn{flex:1}
.extraform{display:flex;gap:8px;margin-bottom:12px}
.extraform input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 12px}
.progress div{height:100%;background:var(--brand);transition:width .2s}
.link{background:none;border:none;color:var(--brand);font-weight:600;min-height:44px;padding:0 6px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.sheet h2{margin:4px 0 12px;font-size:20px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px}
.ing{display:grid;grid-template-columns:1fr 64px 72px 44px;gap:6px;margin-bottom:6px;align-items:center}
.ing input,.ing select{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 8px;width:100%;min-width:0}
.ing select{grid-column:1 / 4}
.ingwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
</style>

<body>
<header>
  <h1 id="title">Pick your meals</h1>
  <p id="subtitle">Tap meals you want to make this week</p>
</header>

<main>
  <section id="view-meals" class="view active">
    <input id="search" class="search" type="search" placeholder="Search meals…" autocomplete="off">
    <div id="meals"></div>
    <button class="btn block" id="addMeal" style="margin-top:8px">＋ Add your own meal</button>
    <div style="text-align:center;margin-top:16px"><button class="link" id="restore">Restore built-in meals</button></div>
  </section>

  <section id="view-list" class="view">
    <div id="listChips" class="chips"></div>
    <div class="progress"><div id="prog" style="width:0"></div></div>
    <form id="extraForm" class="extraform" autocomplete="off">
      <input id="extraInput" placeholder="Add an extra item (e.g. paper towels)" enterkeyhint="done">
      <button class="btn primary" type="submit" aria-label="Add item">Add</button>
    </form>
    <div class="toolbar">
      <button class="btn" id="share">📤 Share</button>
      <button class="btn" id="clearChecked">Clear ✓</button>
      <button class="btn danger" id="newList">New list</button>
    </div>
    <div id="list"></div>
    <div id="hiddenWrap"></div>
  </section>
</main>

<div class="cta" id="cta"><button class="btn primary" id="goList">Make grocery list</button></div>

<nav>
  <button id="tab-meals" class="active" data-view="meals"><span class="i">🍽️</span>Meals<span class="badge" id="mealBadge" hidden></span></button>
  <button id="tab-list" data-view="list"><span class="i">🛒</span>Grocery list<span class="badge" id="listBadge" hidden></span></button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script id="core">
/* ===== Pure logic (unit-tested in node) ===== */
var CATEGORIES = ["Produce","Meat & Seafood","Dairy & Eggs","Bakery","Pantry","Spices","Frozen","Other"];

function normName(s){ return String(s||"").trim().replace(/\s+/g," ").toLowerCase(); }
function itemKey(name, unit){ return normName(name) + "|" + normName(unit); }

function round2(n){ return Math.round(n*100)/100; }

/* Scale a meal's ingredients: chosen servings / base servings */
function scaleIngredients(meal, servings){
  var base = meal.servings > 0 ? meal.servings : 1;
  var f = (servings > 0 ? servings : base) / base;
  return (meal.ingredients||[]).map(function(i){
    var q = (i.qty === "" || i.qty == null || isNaN(Number(i.qty))) ? null : round2(Number(i.qty) * f);
    return { name:i.name, qty:q, unit:i.unit||"", category:i.category||"Other" };
  });
}

/* selections: [{meal, servings}] ; extras: [{name, qty, unit, category}] */
function buildList(selections, extras){
  var map = {}, order = [];
  function add(ing, source){
    if(!ing || !normName(ing.name)) return;
    var k = itemKey(ing.name, ing.unit);
    var e = map[k];
    if(!e){
      e = map[k] = { key:k, name:String(ing.name).trim(), unit:(ing.unit||"").trim(), qty:null,
        category: CATEGORIES.indexOf(ing.category) >= 0 ? ing.category : "Other", sources:[], extra:false };
      order.push(k);
    }
    if(ing.qty != null && ing.qty !== "" && !isNaN(Number(ing.qty))) e.qty = round2((e.qty||0) + Number(ing.qty));
    if(source && e.sources.indexOf(source) < 0) e.sources.push(source);
    if(!source) e.extra = true;
  }
  (selections||[]).forEach(function(s){
    scaleIngredients(s.meal, s.servings).forEach(function(i){ add(i, s.meal.name); });
  });
  (extras||[]).forEach(function(x){ add(x, null); });
  var groups = CATEGORIES.map(function(c){
    return { category:c, items: order.map(function(k){return map[k];}).filter(function(e){return e.category===c;})
      .sort(function(a,b){ return a.name.localeCompare(b.name); }) };
  }).filter(function(g){ return g.items.length; });
  return groups;
}

var FRAC = [[0.125,"⅛"],[0.25,"¼"],[0.333,"⅓"],[0.5,"½"],[0.667,"⅔"],[0.75,"¾"]];
function fmtQty(q){
  if(q == null) return "";
  var whole = Math.floor(q), rem = q - whole;
  if(rem < 0.02) return String(whole);
  if(rem > 0.98) return String(whole+1);
  for(var i=0;i<FRAC.length;i++){
    if(Math.abs(rem - FRAC[i][0]) < 0.03) return (whole ? whole : "") + FRAC[i][1];
  }
  return String(round2(q));
}
/* Things bought whole (no unit, or package units) round UP to a buyable amount */
var WHOLE_UNITS = ["","head","heads","can","cans","jar","jars","bottle","bottles","packet","packets","bag","bags","box","boxes","loaf","loaves","bunch","bunches","pack","packs","stalks","cloves"];
function shopQty(e){
  if(e.qty == null) return null;
  return WHOLE_UNITS.indexOf(normName(e.unit)) >= 0 ? Math.ceil(e.qty - 0.01) : e.qty;
}
function fmtItem(e){
  var q = fmtQty(shopQty(e));
  return (q ? q + (e.unit ? " " + e.unit : "") + " " : (e.unit ? e.unit + " " : "")) + e.name;
}
function listToText(groups, isHidden, isChecked){
  var out = ["🛒 Grocery list",""];
  groups.forEach(function(g){
    var items = g.items.filter(function(e){ return !(isHidden && isHidden(e.key)); });
    if(!items.length) return;
    out.push(g.category.toUpperCase());
    items.forEach(function(e){ out.push((isChecked && isChecked(e.key) ? "✓ " : "• ") + fmtItem(e)); });
    out.push("");
  });
  return out.join("\n").trim();
}

/* Parse a free-text extra like "2 lb apples" or "milk" */
function parseExtra(text){
  var t = String(text||"").trim();
  var m = t.match(/^(\d+(?:\.\d+)?|\d+\/\d+)\s+(?:(lb|lbs|oz|g|kg|cup|cups|can|cans|pack|packs|bag|bags|bottle|bottles|box|boxes|dozen|bunch|jar|ct)\s+)?(.+)$/i);
  if(!m) return { name:t, qty:null, unit:"", category:"Other" };
  var q = m[1].indexOf("/")>0 ? (function(p){return Number(p[0])/Number(p[1]);})(m[1].split("/")) : Number(m[1]);
  return { name:m[3].trim(), qty:round2(q), unit:(m[2]||"").toLowerCase(), category:"Other" };
}

if(typeof module !== "undefined" && module.exports){
  module.exports = { CATEGORIES:CATEGORIES, normName:normName, itemKey:itemKey, scaleIngredients:scaleIngredients,
    buildList:buildList, fmtQty:fmtQty, shopQty:shopQty, fmtItem:fmtItem, listToText:listToText, parseExtra:parseExtra };
}
</script>

 {id:"b20",emoji:"🍲",name:"Beef Stew",servings:6,ingredients:[I("beef stew meat",2,"lb",M),I("baby potatoes",1.5,"lb",P),I("carrot",4,"",P),I("celery",2,"stalks",P),I("yellow onion",1,"",P),I("beef broth",32,"oz",PA),I("tomato paste",2,"tbsp",PA),I("all-purpose flour",2,"tbsp",PA),I("dried thyme",1,"tsp",S)]},
 {id:"b21",emoji:"🥣",name:"Overnight Oats",servings:2,ingredients:[I("rolled oats",1,"cup",PA),I("milk",1,"cup",D),I("greek yogurt",0.5,"cup",D),I("chia seeds",2,"tbsp",PA),I("blueberries",1,"cup",P),I("honey",2,"tbsp",PA)]}
];
</script>

<script>
(function(){
var LS = "mealGrocery.v1";
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

var state;
function defaults(){ return { meals: clone(BUILTIN_MEALS), sel:{}, checked:{}, have:{}, extras:[], view:"meals" }; }
function load(){
  try { var s = JSON.parse(localStorage.getItem(LS)); if(s && Array.isArray(s.meals)){ var d = defaults(); for(var k in d) if(!(k in s)) s[k]=d[k]; return s; } } catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
state = load();

var toastT;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},1800); }

function mealById(id){ for(var i=0;i<state.meals.length;i++) if(state.meals[i].id===id) return state.meals[i]; return null; }
function selections(){
  var out=[]; for(var id in state.sel){ var m=mealById(id); if(m) out.push({meal:m, servings:state.sel[id]}); else delete state.sel[id]; }
  return out;
}
function currentGroups(){ return buildList(selections(), state.extras); }

/* ---------- Meals view ---------- */
function renderMeals(){
  var q = normName($("#search").value);
  var html = "";
  var meals = state.meals.filter(function(m){
    return !q || normName(m.name).indexOf(q)>=0 || m.ingredients.some(function(i){return normName(i.name).indexOf(q)>=0;});
  });
  var selected = meals.filter(function(m){return state.sel[m.id];});
  var others = meals.filter(function(m){return !state.sel[m.id];});
  function card(m){
    var s = state.sel[m.id];
    var sub = s ? (m.ingredients.length + " ingredients") : (m.ingredients.slice(0,4).map(function(i){return i.name;}).join(", ") + (m.ingredients.length>4?"…":""));
    var right = s
      ? '<div class="stepper"><button data-act="dec" data-id="'+m.id+'" aria-label="Fewer servings">−</button><div class="val"><b>'+s+'</b>servings</div><button data-act="inc" data-id="'+m.id+'" aria-label="More servings">+</button></div>'
      : '<button class="pick" data-act="pick" data-id="'+m.id+'">Add</button>';
    return '<div class="card meal'+(s?' sel':'')+'"><div class="emoji">'+esc(m.emoji||"🍽️")+'</div>'+
      '<div class="info" data-act="edit" data-id="'+m.id+'"><div class="name">'+esc(m.name)+'</div><div class="sub">'+esc(sub)+'</div></div>'+right+'</div>';
  }
  if(selected.length){
    html += '<div class="sectiontitle"><span>Selected ('+selected.length+')</span><button class="link" data-act="clearsel">Clear</button></div>';
    html += selected.map(card).join("");
    html += '<div class="sectiontitle"><span>More meals</span></div>';
  }
  html += others.map(card).join("");
  if(!meals.length) html = '<div class="empty"><div class="big">🔍</div>No meals match “'+esc($("#search").value)+'”.</div>';
  $("#meals").innerHTML = html;
}

/* ---------- List view ---------- */
function renderList(){
  var groups = currentGroups();
  var total=0, done=0, hidden=[];
  var html = groups.map(function(g){
    var vis = g.items.filter(function(e){ if(state.have[e.key]){ hidden.push(e); return false;} return true; });
    if(!vis.length) return "";
    var rows = vis.map(function(e){
      total++; var c = !!state.checked[e.key]; if(c) done++;
      var q = fmtQty(shopQty(e));
      var from = e.sources.length ? e.sources.join(", ") : "Extra item";
      return '<div class="item'+(c?' done':'')+'"><label><input type="checkbox" data-key="'+esc(e.key)+'"'+(c?' checked':'')+'>'+
        '<span class="t">'+(q||e.unit?'<span class="q">'+esc(q+(e.unit?(q?" ":"")+e.unit:""))+'</span> ':'')+esc(e.name)+'<span class="from">'+esc(from)+'</span></span></label>'+
        (e.extra && !e.sources.length ? '<button class="have" data-act="delextra" data-key="'+esc(e.key)+'" aria-label="Remove">✕</button>'
          : '<button class="have" data-act="have" data-key="'+esc(e.key)+'">Have it</button>')+'</div>';
    }).join("");
    return '<div class="card group"><h3><span>'+esc(g.category)+'</span><span>'+vis.length+'</span></h3>'+rows+'</div>';
  }).join("");
  if(!groups.length){
    html = '<div class="empty"><div class="big">🧺</div>Your list is empty.<br>Pick some meals first, or add extra items above.<br><br><button class="btn primary" data-act="tomeals">Choose meals</button></div>';
  }
  $("#list").innerHTML = html;
  var hw = "";
  if(hidden.length){
    hw = '<div class="sectiontitle"><span>Already have ('+hidden.length+')</span></div><div class="card group">'+
      hidden.map(function(e){ return '<div class="item"><label><span class="t" style="opacity:.6">'+esc(fmtItem(e))+'</span></label><button class="have" data-act="unhave" data-key="'+esc(e.key)+'">Need it</button></div>'; }).join("")+'</div>';
  }
  $("#hiddenWrap").innerHTML = hw;
  var sels = selections();
  $("#listChips").innerHTML = sels.map(function(s){ return '<span class="chip">'+esc((s.meal.emoji||"")+" "+s.meal.name)+' · '+s.servings+'</span>'; }).join("");
  $("#prog").style.width = total ? (100*done/total)+"%" : "0";
  return {total:total, done:done};
}

function render(){
  var v = state.view;
  document.querySelectorAll(".view").forEach(function(el){ el.classList.toggle("active", el.id==="view-"+v); });
  document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("active", b.dataset.view===v); });
  var nSel = Object.keys(state.sel).length;
  renderMeals();
  var st = renderList();
  var left = st.total - st.done;
  $("#mealBadge").hidden = !nSel; $("#mealBadge").textContent = nSel;
  $("#listBadge").hidden = !left; $("#listBadge").textContent = left;
  $("#cta").classList.toggle("show", v==="meals" && nSel>0);
  $("#goList").textContent = "Make grocery list (" + nSel + " meal" + (nSel===1?"":"s") + ")";
  if(v==="meals"){ $("#title").textContent="Pick your meals"; $("#subtitle").textContent= nSel ? nSel+" selected · tap a meal to view or edit" : "Tap Add on meals you want to make"; }
  else { $("#title").textContent="Grocery list"; $("#subtitle").textContent= st.total ? (st.done+" of "+st.total+" in the cart") : "Nothing to buy yet"; }
  save();
}
function setView(v){ state.view=v; render(); window.scrollTo(0,0); }

/* ---------- Events ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act],[data-view]"); if(!t) return;
  if(t.dataset.view && !t.dataset.act){ setView(t.dataset.view); return; }
  var id=t.dataset.id, key=t.dataset.key, m=id&&mealById(id);
  switch(t.dataset.act){
    case "pick": state.sel[id] = m.servings||4; break;
    case "inc": state.sel[id] = Math.min(99,(state.sel[id]||1)+1); break;
    case "dec": if(state.sel[id]<=1) delete state.sel[id]; else state.sel[id]--; break;
    case "clearsel": state.sel={}; break;
    case "edit": openEditor(m); return;
    case "have": state.have[key]=true; delete state.checked[key]; toast("Hidden — you already have it"); break;
    case "unhave": delete state.have[key]; break;
    case "delextra": state.extras = state.extras.filter(function(x){ return itemKey(x.name,x.unit)!==key; }); delete state.checked[key]; break;
    case "tomeals": setView("meals"); return;
    default: return;
  }
  render();
});
document.addEventListener("change", function(ev){
  var k = ev.target.dataset && ev.target.dataset.key;
  if(ev.target.type==="checkbox" && k){ if(ev.target.checked) state.checked[k]=true; else delete state.checked[k]; render(); }
});
$("#search").addEventListener("input", renderMeals);
$("#goList").addEventListener("click", function(){ setView("list"); });
$("#addMeal").addEventListener("click", function(){ openEditor(null); });
$("#restore").addEventListener("click", function(){
  var have = {}; state.meals.forEach(function(m){ have[m.id]=1; });
  var added = 0;
  BUILTIN_MEALS.forEach(function(b){ if(!have[b.id]){ state.meals.push(clone(b)); added++; } });
  if(!added && !confirm("Reset built-in meals to their original recipes? Your own meals are kept.")) return;
  if(!added){ state.meals = state.meals.map(function(m){ var b=BUILTIN_MEALS.filter(function(x){return x.id===m.id;})[0]; return b?clone(b):m; }); }
  toast(added ? "Restored "+added+" meal"+(added>1?"s":"") : "Built-in meals reset"); render();
});
$("#extraForm").addEventListener("submit", function(ev){
  ev.preventDefault(); var v=$("#extraInput").value.trim(); if(!v) return;
  var x = parseExtra(v); state.extras.push(x); delete state.have[itemKey(x.name,x.unit)];
  $("#extraInput").value=""; render();
});
$("#clearChecked").addEventListener("click", function(){
  var n=Object.keys(state.checked).length; if(!n){ toast("Nothing checked yet"); return; }
  // checked extras are removed; checked meal items are unchecked
  state.extras = state.extras.filter(function(x){ return !state.checked[itemKey(x.name,x.unit)]; });
  state.checked={}; toast("Cleared checked items"); render();
});
$("#newList").addEventListener("click", function(){
  if(!confirm("Start a new list? This clears selected meals, extras, and checkmarks.")) return;
  state.sel={}; state.checked={}; state.have={}; state.extras=[]; setView("meals");
});
$("#share").addEventListener("click", function(){
  var text = listToText(currentGroups(), function(k){return state.have[k];}, function(k){return state.checked[k];});
  if(text.split("\n").length<=1){ toast("List is empty"); return; }
  if(navigator.share){ navigator.share({title:"Grocery list", text:text}).catch(function(e){ if(e && e.name!=="AbortError") copy(text); }); }
  else copy(text);
});
function copy(text){
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok=false; try{ ok=document.execCommand("copy"); }catch(e){} document.body.removeChild(ta);
    toast(ok ? "List copied to clipboard" : "Couldn't copy — try again");
  }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(function(){ toast("List copied to clipboard"); }, fallback); }
  else fallback();
}

/* ---------- Meal editor ---------- */
var modal=$("#modal"), sheet=$("#sheet");
function closeModal(){ modal.classList.remove("show"); document.body.style.overflow=""; }
modal.addEventListener("click", function(e){ if(e.target===modal) closeModal(); });
function catOptions(sel){ return CATEGORIES.map(function(c){ return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'; }).join(""); }
function ingRow(i){
  i = i || {name:"",qty:"",unit:"",category:"Produce"};
  return '<div class="ingwrap"><div class="ing"><input class="in-name" placeholder="Ingredient" value="'+esc(i.name)+'">'+
    '<input class="in-qty" inputmode="decimal" placeholder="Qty" value="'+esc(i.qty==null?"":i.qty)+'">'+
    '<input class="in-unit" placeholder="Unit" value="'+esc(i.unit)+'">'+
    '<button type="button" class="iconbtn rm" aria-label="Remove ingredient">🗑️</button>'+
    '<select class="in-cat">'+catOptions(i.category)+'</select></div></div>';
}
function openEditor(m){
  var isNew = !m; m = m ? clone(m) : {id:null, name:"", emoji:"🍽️", servings:4, ingredients:[{name:"",qty:"",unit:"",category:"Produce"}]};
  sheet.innerHTML = '<h2>'+(isNew?"New meal":"Edit meal")+'</h2>'+
    '<div class="row"><label class="field" style="width:76px"><span>Icon</span><input id="ed-emoji" maxlength="4" value="'+esc(m.emoji)+'" style="text-align:center;font-size:22px"></label>'+
    '<label class="field" style="flex:1"><span>Meal name</span><input id="ed-name" placeholder="e.g. Grandma\'s meatloaf" value="'+esc(m.name)+'"></label></div>'+
    '<label class="field"><span>Recipe makes (servings)</span><input id="ed-serv" type="number" min="1" max="99" inputmode="numeric" value="'+esc(m.servings)+'"></label>'+
    '<div class="sectiontitle" style="margin-top:4px"><span>Ingredients</span></div><div id="ed-ings">'+m.ingredients.map(ingRow).join("")+'</div>'+
    '<button class="btn block" id="ed-add" type="button">＋ Add ingredient</button>'+
    '<div class="row" style="margin-top:16px"><button class="btn" id="ed-cancel" style="flex:1">Cancel</button><button class="btn primary" id="ed-save" style="flex:2">Save meal</button></div>'+
    (isNew?'':'<button class="btn block danger" id="ed-del" style="margin-top:10px">Delete meal</button>');
  modal.classList.add("show"); document.body.style.overflow="hidden";
  $("#ed-add").onclick=function(){ $("#ed-ings").insertAdjacentHTML("beforeend", ingRow()); var ins=$("#ed-ings").querySelectorAll(".in-name"); ins[ins.length-1].focus(); };
  $("#ed-ings").onclick=function(e){ var b=e.target.closest(".rm"); if(b) b.closest(".ingwrap").remove(); };
  $("#ed-cancel").onclick=closeModal;
  if(!isNew) $("#ed-del").onclick=function(){ if(!confirm('Delete "'+m.name+'"?')) return; state.meals=state.meals.filter(function(x){return x.id!==m.id;}); delete state.sel[m.id]; closeModal(); render(); toast("Meal deleted"); };
  $("#ed-save").onclick=function(){
    var name=$("#ed-name").value.trim(); if(!name){ $("#ed-name").focus(); toast("Give your meal a name"); return; }
    var ings=[]; $("#ed-ings").querySelectorAll(".ingwrap").forEach(function(w){
      var n=w.querySelector(".in-name").value.trim(); if(!n) return;
      var qs=w.querySelector(".in-qty").value.trim(), q=null;
      if(qs){ q = qs.indexOf("/")>0 ? Number(qs.split("/")[0])/Number(qs.split("/")[1]) : Number(qs); if(isNaN(q)) q=null; }
      ings.push({name:n, qty:q, unit:w.querySelector(".in-unit").value.trim(), category:w.querySelector(".in-cat").value});
    });
    if(!ings.length){ toast("Add at least one ingredient"); return; }
    var meal={id:m.id||uid(), name:name, emoji:$("#ed-emoji").value.trim()||"🍽️", servings:Math.max(1,parseInt($("#ed-serv").value,10)||4), ingredients:ings};
    if(isNew) state.meals.unshift(meal); else state.meals=state.meals.map(function(x){return x.id===meal.id?meal:x;});
    closeModal(); render(); toast(isNew?"Meal added":"Meal saved");
  };
  if(isNew) setTimeout(function(){ $("#ed-name").focus(); },50);
}

render();
})();
</script>
</body>
</html>
